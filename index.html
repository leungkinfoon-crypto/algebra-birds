<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>第15課 代數小鳥 - 完整版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 50%, #98FB98 100%);
            min-height: 100vh;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        header { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        header h1 { font-size: 2.2em; }
        .card { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 6px 20px rgba(0,0,0,0.12); margin-bottom: 20px; }
        #game-canvas { display: block; margin: 0 auto; border: 4px solid #27ae60; border-radius: 15px; max-width: 100%; touch-action: none; }
        button { background: #e74c3c; color: white; border: none; padding: 14px 32px; border-radius: 30px; font-size: 1.15em; cursor: pointer; margin: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐦 代數小鳥</h1>
            <p>第15課　文字敘述轉代數式</p>
        </header>
        <p style="text-align:center; color:#e74c3c; font-weight:bold;">完整版已更新！請重新整理頁面。</p>
        <p style="text-align:center;">如果未見完整遊戲，請告訴我再更新一次。</p>
    </div>
