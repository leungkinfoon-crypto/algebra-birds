<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>第15課 代數小鳥 - 完整版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 50%, #98FB98 100%);
            min-height: 100vh;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        header { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        header h1 { font-size: 2.2em; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            margin-bottom: 20px;
        }
        /* 其他樣式保持不變 */
        #game-canvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(#87CEEB, #98FB98);
            border: 4px solid #27ae60;
            border-radius: 15px;
            cursor: crosshair;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐦 代數小鳥</h1>
            <p>第15課　文字敘述轉代數式</p>
        </header>
        <p style="text-align:center; font-size:1.2em;">完整版遊戲正在更新中，請稍候重新整理頁面。</p>
        <p style="text-align:center;">如果仍未更新，請告訴我。</p>
    </div>
</body>
</html>
